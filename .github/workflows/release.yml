# Single GitHub Actions release pipeline for the TowerSignal iOS SDK (SPM + CocoaPods)

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release SDK (SPM & CocoaPods)
    runs-on: macos-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version & validate version consistency
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Git Tag: ${TAG_NAME}"

          # Reject prerelease tags (e.g. v1.0.0-rc1, v1.0.0-beta)
          if [[ "$TAG_NAME" =~ - ]]; then
            echo "::error::Prerelease tags (e.g. $TAG_NAME) are not supported for production release."
            exit 1
          fi

          # Extract semver number (strip leading 'v')
          if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "$TAG_NAME" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$TAG_NAME' does not follow semantic versioning (vX.Y.Z)."
            exit 1
          fi

          echo "Release Version: ${VERSION}"

          # 1. Verify TowerSignalCore/Sources/Versioning.swift __sdkVersion
          SDK_VERSION="$(grep '__sdkVersion' TowerSignalCore/Sources/Versioning.swift | awk -F '"' '{print $2}')"
          echo "Versioning.swift __sdkVersion: ${SDK_VERSION}"
          if [[ "$SDK_VERSION" != "$VERSION" ]]; then
            echo "::error::__sdkVersion ($SDK_VERSION) in Versioning.swift does not match release tag version ($VERSION)"
            exit 1
          fi

          # 2. Verify all .podspec versions
          PODSPECS=(
            "TowerSignalInternal.podspec"
            "TowerSignalCore.podspec"
            "TowerSignalLogs.podspec"
            "TowerSignalTrace.podspec"
            "TowerSignalRUM.podspec"
            "TowerSignalSessionReplay.podspec"
            "TowerSignalCrashReporting.podspec"
            "TowerSignalWebViewTracking.podspec"
            "TowerSignalFlags.podspec"
            "TowerSignalProfiling.podspec"
          )

          for spec in "${PODSPECS[@]}"; do
            if [ ! -f "$spec" ]; then
              echo "::error::Podspec file '$spec' does not exist."
              exit 1
            fi
            SPEC_VER="$(grep -E '^[[:space:]]*s\.version[[:space:]]*=' "$spec" | awk -F '"' '{print $2}')"
            echo "$spec s.version: $SPEC_VER"
            if [[ "$SPEC_VER" != "$VERSION" ]]; then
              echo "::error::$spec version ($SPEC_VER) does not match release tag version ($VERSION)"
              exit 1
            fi
          done

          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install required tools
        run: |
          set -euo pipefail
          if ! command -v xcbeautify &> /dev/null; then
            brew install xcbeautify || true
          fi
          xcodebuild -version
          swift --version
          pod --version

      - name: Validate + build SPM package
        run: |
          set -euo pipefail
          # The package is UIKit-based, so it must be built for iOS/tvOS via xcodebuild;
          # a host `swift build` cannot resolve UIKit. Unit tests run in ios-agent-test.yml
          # on the branch before tagging, so they are not repeated here.
          ./scripts/validate_spm.sh
          make spm-build-ios
          make spm-build-tvos

      - name: Build XCFrameworks
        env:
          # Carthage fetches binary manifests from raw.githubusercontent.com; an authenticated
          # request avoids shared-runner rate limits (see tools/carthage-shim.sh).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./tools/release/build.sh --tag "${TAG_NAME}" --artifacts-path "artifacts"

      - name: Create ZIP + SHA256
        run: |
          set -euo pipefail
          cd artifacts
          shasum -a 256 TowerSignal.xcframework.zip > TowerSignal.xcframework.zip.sha256
          shasum -a 256 TowerSignal-with-arm64e.xcframework.zip > TowerSignal-with-arm64e.xcframework.zip.sha256
          ls -lh

      - name: Validate Package.swift
        run: |
          set -euo pipefail
          swift package resolve
          swift package dump-package > /dev/null
          echo "Package.swift is valid."

      - name: Validate .podspec
        run: |
          set -euo pipefail
          PODSPECS=(
            "TowerSignalInternal.podspec"
            "TowerSignalCore.podspec"
            "TowerSignalLogs.podspec"
            "TowerSignalTrace.podspec"
            "TowerSignalRUM.podspec"
            "TowerSignalSessionReplay.podspec"
            "TowerSignalCrashReporting.podspec"
            "TowerSignalWebViewTracking.podspec"
            "TowerSignalFlags.podspec"
            "TowerSignalProfiling.podspec"
          )
          for spec in "${PODSPECS[@]}"; do
            echo "▸ pod spec lint $spec --allow-warnings"
            pod spec lint "$spec" --allow-warnings --quick || pod lib lint "$spec" --allow-warnings
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Creating or verifying GitHub Release for tag: ${TAG_NAME}"
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; leaving it untouched."
          else
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG_NAME}" \
              --verify-tag \
              --generate-notes
          fi

      - name: Upload SPM XCFramework assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Uploading XCFramework assets and SHA256 checksums to ${TAG_NAME} release..."
          cd artifacts
          gh release upload "${TAG_NAME}" \
            TowerSignal.xcframework.zip \
            TowerSignal.xcframework.zip.sha256 \
            TowerSignal-with-arm64e.xcframework.zip \
            TowerSignal-with-arm64e.xcframework.zip.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          echo "Assets uploaded successfully."

      - name: Publish CocoaPods podspec
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN secret is missing or empty. Please set COCOAPODS_TRUNK_TOKEN in GitHub Repository Secrets."
            exit 1
          fi

          PODSPECS=(
            "TowerSignalInternal.podspec"
            "TowerSignalCore.podspec"
            "TowerSignalLogs.podspec"
            "TowerSignalTrace.podspec"
            "TowerSignalRUM.podspec"
            "TowerSignalSessionReplay.podspec"
            "TowerSignalCrashReporting.podspec"
            "TowerSignalWebViewTracking.podspec"
            "TowerSignalFlags.podspec"
            "TowerSignalProfiling.podspec"
          )

          echo "Publishing podspecs to CocoaPods Trunk..."

          for spec in "${PODSPECS[@]}"; do
            echo "▸ Publishing $spec..."
            MAX_RETRIES=5
            RETRY_COUNT=0
            SUCCESS=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              OUTPUT=$(pod trunk push "$spec" --allow-warnings 2>&1) && SUCCESS=1 && break || true

              if echo "$OUTPUT" | grep -q -i "Unable to accept duplicate entry"; then
                echo "▸ $spec version ${RELEASE_VERSION} already exists in CocoaPods Trunk. Skipping."
                SUCCESS=1
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "▸ Retrying $spec push (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                echo "$OUTPUT"
                sleep 20
              else
                echo "::error::Failed to push $spec to CocoaPods Trunk after $MAX_RETRIES attempts."
                echo "$OUTPUT"
                exit 1
              fi
            done
          done

          echo "All podspecs published to CocoaPods Trunk successfully."
